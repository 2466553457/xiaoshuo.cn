<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>我的音乐列表</title>
  </head>
  <body>
    <!--
  ============================================================
  使用说明：
  1. 把这个文件上传到你的 GitHub 仓库
  2. 用 raw.githubusercontent.com 的原始链接访问它
     例如：https://raw.githubusercontent.com/你的用户名/仓库名/main/music.html
  3. 在播放器网页顶部填入这个链接，点"加载"即可
  ============================================================

  每首歌就是一个 <div class="music"> 块，改下面的内容就行：
  - data-name：歌曲名
  - data-artist：歌手
  - data-url：音乐文件直链（mp3/m4a/ogg/flac 等）
  - data-cover：封面图直链（可选，不要就留空）
-->

    <div class="music-list">
      <div
        class="music"
        data-name="示例歌曲 1"
        data-artist="歌手 A"
        data-url="https://wdljsyg.xkyfzs.top/1-50/1.mp3"
        data-cover="https://example.com/cover1.jpg"
      ></div>

      <div
        class="music"
        data-name="示例歌曲 2"
        data-artist="歌手 B"
        data-url="https://wdljsyg.xkyfzs.top/1-50/2.mp3"
        data-cover=""
      ></div>

      <div
        class="music"
        data-name="示例歌曲 3"
        data-artist="歌手 C"
        data-url="https://wdljsyg.xkyfzs.top/1-50/3.mp3"
        data-cover=""
      ></div>

      <!-- 继续复制上面的块，加更多歌曲 -->
    </div>
  </body>
</html>
